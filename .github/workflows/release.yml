name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Неймспейс Docker Hub (пользователь или организация) берётся из переменной
  # репозитория DOCKERHUB_NAMESPACE; без неё релизы идут только в GHCR.
  HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/webinar_mtx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Официальные релизы (теги v*): публикуются и на Docker Hub,
      # если заданы DOCKERHUB_NAMESPACE (Variable) и DOCKERHUB_USERNAME /
      # DOCKERHUB_TOKEN (Secrets). Без них шаги молча пропускаются.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (GHCR — dev-сборки main + релизы)
        id: meta_ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Docker meta (Docker Hub — только официальные релизы)
        id: meta_hub
        if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.HUB_IMAGE }}
          # flavor по умолчанию добавляет latest к семвер-тегу
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Combine image tags
        id: tags
        env:
          GHCR_TAGS: ${{ steps.meta_ghcr.outputs.tags }}
          HUB_TAGS: ${{ steps.meta_hub.outputs.tags }}
        run: |
          {
            echo 'tags<<TAGS_EOF'
            echo "$GHCR_TAGS"
            if [ -n "$HUB_TAGS" ]; then
              echo "$HUB_TAGS"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
